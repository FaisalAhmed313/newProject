 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <title>Document</title>
    <style>
        body{
            font-family: arial;
            color: white;
            font-size: 20px;
            background-color: black;
        }
        header {
            background-color: rgba(164, 171, 187, 0.2);
        }
        nav li {
            margin-left: 60px;
        }
        nav li:hover {
            cursor: pointer;
            color: red;
            margin-left: 60px;
        }
        .bi-cart {
            font-size: 20px;
        }

        #count {
            font-size: 17px;
            background-color: red;
            color: white;
            border-radius: 50px;
            width: 14px;
            text-align: center;
            height: 21px;
            right: 4px;
            top: 0px;
        }
       
        
    </style>
    <script> 
   
    function loadProduct(data){
      data.map(function(products){
        let card = document.createElement("div");
        
        card.className ="card w-25"
        
        card.innerHTML =       `
        <div class="card-header">
        <h2>${products.title}</h2>    
        </div>
        <div class="card-body">
        <img src="${products.image}" width="200" height="200px">    
        </div>
        <div class="card-footer">
        <button onclick="AddtoCart('${products._id}')" class="btn btn-warning w-100">Add to cart</button>    
        </div>


        ` 
        document.querySelector("main").appendChild(card)

      })
      }

    let categories = ["Electronics","Casuals","Footwear"];
    function loadcategories(){

        categories.map(function(category){
            Options = document.createElement("option");

            Options.innerHTML = category

            document.getElementById("items").appendChild(Options);
        })
        
    }
    
    let cartitems = [];

    function CartCount(){
    document.getElementById("count").innerHTML = cartitems.length;

    }

    function AddtoCart(id){
      document.getElementById("count").style.display = "block"
      fetch(`https://fakestoreapi.noksha.dev/api/products/${id}`)
      .then(function(response){
        return response.json()
      })
      .then(function(product){  
     cartitems.push(product)
     CartCount()
       
    //   .catch(function(result){
    //     console.log(result);
        
      })
    }
     
    // let filteredProdcuts = [];
    function Searchproducts(){
        let txtSearch = document.getElementById("txtsearch").value.toLowerCase();
        
        let filteredProdcuts = allProdcuts.filter(function(products){
            return products.title.toLowerCase().includes(txtSearch);
        })

        document.querySelector("main").innerHTML = "";

        loadProduct(filteredProdcuts);
        
        
    }

    function CartClick() {

        document.querySelector(".modal-body").innerHTML = "";
        cartitems.map(function(product){
            let div = document.createElement("div")
            div.className = "d-flex align-items-center gap-3 border-bottom p-2"
            div.innerHTML = `
              <h2>${product.title}</h2>
              
            <img src="${product.image}" width="100" height="100">
            <div><span>${product.price.toLocaleString(`en-in`,{style:"currency",currency : "INR"})}</span></div>
            `
        

            document.querySelector(".modal-body").appendChild(div)
        })        
    }
    
    let allProdcuts = [];
      function bodyload(){
       fetch("https://fakestoreapi.noksha.dev/api/products")
       .then(function(response){
        return response.json()
       })
       .then(function(products){
         allProdcuts = products.data
         loadProduct(allProdcuts)
       })

       loadcategories()
       CartCount()

      }
    </script>
</head>
<body onload="bodyload()">
    
    <div>
        <header class="d-flex justify-content-between p-3 mb-3">
            <h2>Shopify</h2>
            <div class="input-group w-25">
                <input type="text" class="form-control" id="txtsearch" onkeyup="Searchproducts()" placeholder="Search products">
                <button class="bi bi-search btn btn-warning"></button>
            </div>
            <nav class="d-flex list-unstyled">
                <li>Electronics</li>
                <li>Casuals</li>
                <li>Footwear</li>
                <li>Party wear</li>
            </nav>
            <div>
                <button data-bs-target="#cartDetails" onclick="CartClick()" data-bs-toggle="modal" class="bi bi-cart btn btn-warning" style="position: relative;">
                    <span id="count"  style="position: absolute; display: none;">1</span>
                </button>
                
                <div class="modal" id="cartDetails">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                            
                            </div>
                            <div class="modal-body">

                            </div>
                            <div class="modal-footer">

                            </div>

                        </div>
                    </div>

                </div>

            </div>
        </header>

        <section class="row">
            <div class="col-2">
                <select id="items" class="form-select mt-3">
                    
                </select>
            </div>
            <main class="col-10 d-flex flex-wrap gap-3">
          
            </main>
        </section>
    </div>
      <script src="/node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <script src="/node_modules/jquery/dist/jquery.js"></script>
</body>
</html>
